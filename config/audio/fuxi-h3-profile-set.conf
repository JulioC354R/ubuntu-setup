; Fuxi-H3 (receptor USB 040b:0897): conjunto de perfis só com a saída digital e o microfone.
; Esconde a "Saída analógica", que usa o mixer do fone e só ajusta um lado ao mudar o volume.
; Os nomes dos perfis continuam iguais (ex.: output:iec958-stereo+input:mono-fallback).
; Instalado pelo ubuntu-setup em /etc/alsa-card-profile/mixer/profile-sets/fuxi-h3.conf e
; ligado ao receptor pela regra udev 91-fuxi-h3.rules (ENV{ACP_PROFILE_SET}).

[General]
auto-profiles = yes

[Mapping iec958-stereo]
device-strings = iec958:%f
channel-map = left,right
paths-output = iec958-stereo-output
direction = output
priority = 5

[Mapping mono-fallback]
device-strings = hw:%f
channel-map = mono
paths-input = analog-input-mic analog-input analog-input-headset-mic
direction = input
priority = 1
