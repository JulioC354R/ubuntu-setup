# Configurações das extensões do GNOME (formato `dconf load /`).
# Fora daqui de propósito: dados da máquina e estado interno das extensões
#   Bluetooth-Battery-Meter/device-list (MAC e nome dos seus dispositivos)
#   openbar/*bguri (caminho do wallpaper), openbar/trigger-reload, openbar/import-export,
#   openbar/pause-reload, openbar/reloadstyle, openbar/monitor-* (estado e tamanho da tela)
#   tiling-assistant/overridden-settings, tiling-assistant/last-version-installed
#   blur-my-shell/settings-version, caffeine/user-enabled
# Para atualizar a partir da máquina atual: scripts/export-gnome.sh

[org/gnome/shell/extensions/blur-my-shell/popup]
screenshot-corner-radius=36

[org/gnome/shell/extensions/caffeine]
cli-toggle=true
indicator-position-max=3

[org/gnome/shell/extensions/dash-to-dock]
dash-max-icon-size=64
dock-fixed=false
dock-position='BOTTOM'
extend-height=false
show-mounts=false
show-mounts-network=false
show-trash=false

[org/gnome/shell/extensions/ding]
check-x11wayland=true
icon-size='standard'
show-home=false

[org/gnome/shell/extensions/lilypad]
icon-style=1
ignored-order=@as []
lilypad-order=['appindicator_org_freedesktop_StatusNotifierItem', 'tray_icon_tray_app_rustdesk']
reorder=true
rightbox-order=['lilypad', 'vitalsMenu']
show-icons=false

[org/gnome/shell/extensions/openbar]
bartype='Mainland'
bgalpha=0.90000000000000002
default-font='Sans 12'
wmaxbar=true

[org/gnome/shell/extensions/tiling-assistant]
focus-hint-color='rgb(203,67,20)'
tiling-popup-all-workspace=true

[org/gnome/shell/extensions/vitals]
alphabetize=true
battery-colors=@as []
fan-colors=@as []
gpu-colors=@as []
hide-icons=false
hide-zeros=false
hot-sensors=['_memory_usage_', '_processor_usage_', '__temperature_avg__']
icon-style=0
memory-colors=@as []
menu-centered=true
position-in-panel=0
processor-colors=@as []
system-colors=@as []
temperature-colors=@as []
