# Fuxi-H3 (receptor USB 040b:0897): perfil padrão "Digital Stereo (IEC958) + Mono Input".
# No perfil analógico, o volume do sistema vai para o mixer do fone, que só ajusta um lado.
# Instalado pelo ubuntu-setup em ~/.config/wireplumber/wireplumber.conf.d/ (WirePlumber 0.5+).
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-.*Fuxi-H3.*" }
    ]
    actions = {
      update-props = {
        device.profile = "output:iec958-stereo+input:mono-fallback"
      }
    }
  }
]
