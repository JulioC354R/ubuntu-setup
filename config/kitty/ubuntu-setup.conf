# ~/.config/kitty/ubuntu-setup.conf — gerenciado pelo ubuntu-setup (config/kitty/ubuntu-setup.conf).
# É incluído no TOPO do kitty.conf: o que você escrever no kitty.conf, abaixo do include, prevalece.
# Atalhos no estilo do Windows Terminal. Lista completa: ctrl+shift+f1 abre a documentação do kitty.

# ── Fonte e shell ────────────────────────────────────────────────────────────
font_family      MesloLGM Nerd Font
font_size        12
shell            /usr/bin/zsh
shell_integration enabled

# ── Aparência ────────────────────────────────────────────────────────────────
background_opacity         0.85
# Ajustar na hora: ctrl+shift+a e depois m (mais opaco), l (menos opaco), 1 (100%), d (padrão)
dynamic_background_opacity yes
window_padding_width       4
inactive_text_alpha        0.75
confirm_os_window_close    0

# ── Tabs ─────────────────────────────────────────────────────────────────────
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      1
tab_title_template    "{index}: {title}"

# ── Splits (dividir a janela) ────────────────────────────────────────────────
# splits: divisões livres | stack: uma janela em tela cheia (usado pelo zoom)
enabled_layouts splits,stack

# Dividir (abre na mesma pasta da janela atual)
map alt+shift+minus     launch --location=hsplit --cwd=current
map alt+shift+equal     launch --location=vsplit --cwd=current
map alt+shift+backslash launch --location=vsplit --cwd=current
map kitty_mod+enter     launch --location=split --cwd=current

# Mover o foco entre divisões
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down

# Redimensionar a divisão atual
map alt+shift+left  resize_window narrower
map alt+shift+right resize_window wider
map alt+shift+up    resize_window taller
map alt+shift+down  resize_window shorter

# Trocar divisões de lugar
map ctrl+shift+alt+left  move_window left
map ctrl+shift+alt+right move_window right
map ctrl+shift+alt+up    move_window up
map ctrl+shift+alt+down  move_window down

# Zoom: a divisão atual em tela cheia (repita para voltar) | girar divisão horizontal/vertical
map alt+z toggle_layout stack
map alt+r layout_action rotate

# ── Tabs: atalhos ────────────────────────────────────────────────────────────
# Padrões mantidos: ctrl+tab / ctrl+shift+tab (próxima/anterior), ctrl+shift+q (fechar tab),
# ctrl+shift+alt+t (renomear tab), ctrl+shift+. e ctrl+shift+, (mover tab)
map kitty_mod+t new_tab_with_cwd
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# ── Menu (clique direito ou ctrl+shift+m) ───────────────────────────────────
# Lista as ações acima com seus atalhos; um clique executa. Fonte: ubuntu-setup-menu.py.
# Estender a seleção, que era do clique direito, continua em shift+clique direito.
# "ungrabbed": quando um programa usa o mouse (vim, htop), o clique direito continua indo para ele.
mouse_map right press ungrabbed kitten ubuntu-setup-menu.py
map kitty_mod+m kitten ubuntu-setup-menu.py

# ── Grupos de tabs (sessões do kitty) ───────────────────────────────────────
# Cada grupo é um arquivo .kitty-session em ~/.config/kitty/sessions com suas tabs e divisões.
#   alt+shift+a  salva as tabs atuais como grupo (pergunta o nome)
#   alt+shift+s  lista os grupos e troca (abre o grupo se ainda não estiver aberto)
#   alt+shift+p  volta para o grupo anterior
map alt+shift+a save_as_session --save-only --base-dir ~/.config/kitty/sessions
map alt+shift+s goto_session --sort-by=recent sessions
map alt+shift+p goto_session -1
